<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Loam DaBoom app icon: a 3x3 panel of electronic drum pads in the
       voice colours, the centre pad lit as if just hit.
       Used for 256 px and up; icon-small.svg covers 16-48 px. -->
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecd9"/>
      <stop offset="1" stop-color="#ddd2b5"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#chassis)" stroke="#a99c79" stroke-width="8"/>
  <rect x="128" y="138" width="232" height="232" rx="44" fill="#a99c79"/>
  <rect x="128" y="128" width="232" height="232" rx="44" fill="#c08f17"/>
