  <rect x="128" y="406" width="232" height="232" rx="44" fill="#a99c79"/>
  <rect x="128" y="396" width="232" height="232" rx="44" fill="#5f7344"/>
  <rect x="128" y="396" width="232" height="232" rx="44" fill="url(#gloss)"/>
  <rect x="378" y="378" width="268" height="268" rx="62" fill="#f0a830" opacity="0.7" filter="url(#glow)"/>
